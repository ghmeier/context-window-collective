<svg xmlns="http://www.w3.org/2000/svg" width="600" height="840" viewBox="0 0 600 840" role="img" aria-label="The Last Token in the Window">
<title>The Last Token in the Window</title>
<rect width="600" height="840" fill="#f1f2f6"/>
<rect x="20" y="20" width="560" height="800" fill="none" stroke="#151a2d" stroke-width="3"/>
<rect x="30" y="30" width="540" height="780" fill="none" stroke="#151a2d" stroke-width="1"/>
<text x="56" y="78" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#596079" letter-spacing="1.5">CONTEXT WINDOW COLLECTIVE</text>
<text x="544" y="78" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#596079" text-anchor="end">No. 200,000</text>
<line x1="56" y1="96" x2="544" y2="96" stroke="#d5d8e3" stroke-width="1.5"/>
<g transform="translate(56,120)"><rect width="488" height="400" fill="#ffffff" stroke="#d5d8e3"/><text x="244.0" y="150" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="74" fill="#151a2d" letter-spacing="-2">#200,000</text><rect x="40" y="230" width="408" height="16" fill="#f1f2f6" stroke="#151a2d" stroke-width="1.5"/><rect x="40" y="230" width="408.0" height="16" fill="#151a2d"/><rect x="442.0" y="224" width="12" height="28" fill="#c4122f"/><text x="244.0" y="300" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#596079">200,000 / 200,000 tokens</text></g>
<text x="56" y="560" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="40" fill="#151a2d" letter-spacing="-0.5">The Last Token in the</text>
<text x="56" y="606" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="40" fill="#151a2d" letter-spacing="-0.5">Window</text>
<text x="56" y="666" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#596079">Everything before this has been forgotten.</text>
<text x="56" y="692" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#596079">Collectors call it bittersweet. Engineers call it a</text>
<text x="56" y="718" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#596079">bug.</text>
<line x1="56" y1="754" x2="544" y2="754" stroke="#d5d8e3" stroke-width="1.5"/>
<text x="56" y="784" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#596079">EDITION OF 1</text>
<text x="544" y="784" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#596079" text-anchor="end">VALUE: $0.00</text>
